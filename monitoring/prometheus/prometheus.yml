# Prometheus del perfil "monitoring" de docker-compose. El token de /metrics lo escribe el entrypoint
# del servicio en /prometheus/metrics_token a partir de METRICS_TOKEN.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: empleoia
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ["web:5000"]
