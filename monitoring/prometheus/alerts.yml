# Reglas de alerta de Prometheus para EmpleoIA (métricas de /metrics, ver docs/observability.md).
# Validar: promtool check rules monitoring/prometheus/alerts.yml
#          promtool test rules monitoring/prometheus/alerts.test.yml
groups:
  - name: empleoia
    rules:
      - alert: EmpleoIAErrores5xx
        expr: |
          sum(rate(empleoia_http_requests_total{status=~"5.."}[10m]))
            / sum(rate(empleoia_http_requests_total[10m])) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Más del 5 % de los pedidos terminan en error 5xx
          description: "{{ $value | humanizePercentage }} de errores en los últimos 10 minutos."

      - alert: EmpleoIALatenciaAlta
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(empleoia_http_request_duration_seconds_bucket[10m]))) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: El p95 de latencia supera 5 s
          description: "p95 = {{ $value | humanizeDuration }}."

      # SLOs (los mismos de terraform/slo.tf): 99,5 % de pedidos sin 5xx y 95 % en 1 s o menos.
      # Avisan por velocidad de consumo del presupuesto de errores, con ventana larga y corta (SRE Workbook):
      # rápido = 14,4× el presupuesto (2 % en 1 h), lento = 6× (5 % en 6 h).
      - alert: EmpleoIASLODisponibilidadRapido
        expr: |
          (
            sum(rate(empleoia_http_requests_total{status=~"5.."}[1h])) / sum(rate(empleoia_http_requests_total[1h])) > 14.4 * 0.005
          ) and (
            sum(rate(empleoia_http_requests_total{status=~"5.."}[5m])) / sum(rate(empleoia_http_requests_total[5m])) > 14.4 * 0.005
          )
        labels:
          severity: page
        annotations:
          summary: El SLO de disponibilidad gasta su presupuesto de errores muy rápido
          description: "{{ $value | humanizePercentage }} de errores 5xx en la última hora (el SLO permite 0,5 %)."

      - alert: EmpleoIASLODisponibilidadLento
        expr: |
          (
            sum(rate(empleoia_http_requests_total{status=~"5.."}[6h])) / sum(rate(empleoia_http_requests_total[6h])) > 6 * 0.005
          ) and (
            sum(rate(empleoia_http_requests_total{status=~"5.."}[30m])) / sum(rate(empleoia_http_requests_total[30m])) > 6 * 0.005
          )
        labels:
          severity: warning
        annotations:
          summary: El SLO de disponibilidad gasta su presupuesto de errores más rápido de lo que dura el mes
          description: "{{ $value | humanizePercentage }} de errores 5xx en las últimas 6 h (el SLO permite 0,5 %)."

      - alert: EmpleoIASLOLatenciaRapido
        expr: |
          (
            1 - sum(rate(empleoia_http_request_duration_seconds_bucket{le="1.0"}[1h])) / sum(rate(empleoia_http_request_duration_seconds_count[1h])) > 14.4 * 0.05
          ) and (
            1 - sum(rate(empleoia_http_request_duration_seconds_bucket{le="1.0"}[5m])) / sum(rate(empleoia_http_request_duration_seconds_count[5m])) > 14.4 * 0.05
          )
        labels:
          severity: page
        annotations:
          summary: El SLO de latencia gasta su presupuesto muy rápido
          description: "{{ $value | humanizePercentage }} de pedidos tardaron más de 1 s en la última hora (el SLO permite 5 %)."

      - alert: EmpleoIASLOLatenciaLento
        expr: |
          (
            1 - sum(rate(empleoia_http_request_duration_seconds_bucket{le="1.0"}[6h])) / sum(rate(empleoia_http_request_duration_seconds_count[6h])) > 6 * 0.05
          ) and (
            1 - sum(rate(empleoia_http_request_duration_seconds_bucket{le="1.0"}[30m])) / sum(rate(empleoia_http_request_duration_seconds_count[30m])) > 6 * 0.05
          )
        labels:
          severity: warning
        annotations:
          summary: El SLO de latencia gasta su presupuesto más rápido de lo que dura el mes
          description: "{{ $value | humanizePercentage }} de pedidos tardaron más de 1 s en las últimas 6 h (el SLO permite 5 %)."

      # Los propios raspados de /metrics cuentan como pedidos: no se alerta por falta de visitas,
      # sino cuando Prometheus deja de recibir las métricas.
      - alert: EmpleoIASinMetricas
        expr: absent(empleoia_http_requests_total)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus no recibe métricas de la web
          description: La web está caída, no responde /metrics o cambió METRICS_TOKEN.

      - alert: EmpleoIAColaCelery
        expr: max by (queue) (empleoia_celery_queue_length) > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "La cola {{ $labels.queue }} de Celery no baja"
          description: "{{ $value }} tareas esperando: el worker está caído o saturado."

      - alert: EmpleoIACuotaIA80
        # Cada instancia expone el mismo total de Redis: max por kind para no sumarlo una vez por instancia.
        expr: sum(max by (kind) (empleoia_ai_month_tokens)) / max(empleoia_ai_month_token_limit) > 0.8
        labels:
          severity: warning
        annotations:
          summary: Se usó más del 80 % del tope mensual de tokens de IA
          description: "{{ $value | humanizePercentage }} del tope AI_MONTHLY_TOKEN_LIMIT."

      - alert: EmpleoIACuotaIAAgotada
        expr: sum(max by (kind) (empleoia_ai_month_tokens)) >= max(empleoia_ai_month_token_limit)
        labels:
          severity: page
        annotations:
          summary: Se agotó el tope mensual de tokens de IA
          description: Las funciones de IA quedan bloqueadas hasta el mes que viene o hasta subir AI_MONTHLY_TOKEN_LIMIT.

      - alert: EmpleoIAPortalSinOfertas
        # 3 o más búsquedas en un día y ninguna con ofertas: el portal cambió su HTML o bloquea al scraper.
        # Cada instancia expone el mismo total de Redis: se toma el máximo entre instancias de hoy menos el de hace 24 h,
        # así no se suma una vez por instancia ni se pierden búsquedas si las instancias cambian en el día.
        # Sin datos de hace 24 h (Prometheus recién arrancado) o si el total bajó (Redis vaciado) se usa el increase de cada instancia.
        expr: |
          (
            max by (portal) (sum by (portal, instance) (empleoia_scraper_runs_total{outcome=~"empty|error"}))
              - max by (portal) (sum by (portal, instance) (empleoia_scraper_runs_total{outcome=~"empty|error"} offset 24h))
              >= 0
            or sum by (portal) (max by (portal, outcome) (increase(empleoia_scraper_runs_total{outcome=~"empty|error"}[24h])))
          ) >= 3
          unless (
            max by (portal) (empleoia_scraper_runs_total{outcome="ok"})
              - max by (portal) (empleoia_scraper_runs_total{outcome="ok"} offset 24h)
              >= 0
            or max by (portal) (increase(empleoia_scraper_runs_total{outcome="ok"}[24h]))
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.portal }} no devuelve ofertas"
          description: "{{ $value | humanize }} búsquedas en 24 h sin ofertas: revisar el parser con scripts/scraper_health.py."
