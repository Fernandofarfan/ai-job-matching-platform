<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - EmpleoIA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 380px; width: 100%;">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Recuperar contraseña</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST" action="{{ url_for('forgot_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label for="email" class="form-label">Email de tu cuenta</label>
          <input type="email" class="form-control mb-3" id="email" name="email" required autofocus autocomplete="username">
          <button type="submit" class="btn btn-primary w-100">Mandarme un enlace</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="{{ url_for('login') }}">Volver a ingresar</a></p>
      </div>
    </div>
  </main>
</body>
</html>
