<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contraseña nueva - EmpleoIA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 380px; width: 100%;">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Elegí una contraseña nueva</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label for="password" class="form-label">Contraseña nueva</label>
          <input type="password" class="form-control mb-1" id="password" name="password" required minlength="{{ min_password }}" autocomplete="new-password" aria-describedby="password-help">
          <div id="password-help" class="form-text mb-3">Al menos {{ min_password }} caracteres.</div>
          <label for="confirm" class="form-label">Repetir contraseña</label>
          <input type="password" class="form-control mb-3" id="confirm" name="confirm" required minlength="{{ min_password }}" autocomplete="new-password">
          <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
