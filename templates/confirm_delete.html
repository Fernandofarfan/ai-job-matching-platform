<!-- templates/confirm_delete.html -->
{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Confirmar eliminación</h4>
      </div>
      <div class="card-body p-4">
        <p class="lead mb-2">¿Eliminar el perfil de <strong>{{ role_name }}</strong>?</p>
        <p class="text-muted">Esta acción no se puede deshacer (también se borra el CV subido).</p>

        <div class="d-flex gap-2 mt-4">
          <form method="POST" action="/delete_profile/{{ role_type }}/confirm" class="d-inline">
            <button type="submit" class="btn btn-danger">
              <i class="bi bi-trash"></i> Sí, eliminar
            </button>
          </form>
          <a href="/profile" class="btn btn-secondary">
            <i class="bi bi-x-circle"></i> Cancelar
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
