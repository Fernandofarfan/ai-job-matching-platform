[tool.ruff]
target-version = "py312"
extend-exclude = ["alembic/versions", "chrome_extension", "static"]

[tool.ruff.lint]
# Errores reales (pyflakes + bugbear); estilo y formato quedan fuera por ahora
select = ["E9", "F", "B"]
ignore = ["B904", "B007", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
files = ["ai_usage.py", "ats_score.py", "auth.py", "cv_storage.py", "data_export.py", "security_events.py", "two_factor.py", "user_sessions.py", "embeddings.py", "job_alerts.py", "job_dispatch.py", "rate_limit.py", "routers/tracker.py", "routers/pages.py", "routers/auth_pages.py", "fastapi_web.py", "account_notify.py", "google_oauth.py", "main.py", "profile_store.py", "scripts/scraper_health.py", "scripts/eval_matching.py", "matching_eval.py", "models.py", "db_schema.py", "accounts.py", "push.py", "integrations.py", "services/__init__.py", "services/state.py", "services/profiles.py", "services/probe_tasks.py", "services/portal_search.py", "services/connections.py", "scrapers/common.py"]
