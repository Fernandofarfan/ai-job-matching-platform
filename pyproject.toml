[tool.ruff]
target-version = "py312"
extend-exclude = ["alembic/versions", "chrome_extension", "static"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, imports ordenados, sintaxis de Python 3.12, simplificaciones, seguridad (bandit)
# y complejidad. El largo de línea no se controla.
select = ["E", "W", "F", "B", "I", "UP", "SIM", "C4", "PIE", "RET", "PERF", "RUF", "S", "C90"]
ignore = [
    "B904", "B007", "B008",
    "E501",                        # largo de línea
    "RUF001", "RUF002", "RUF003",  # caracteres "ambiguos": los textos en español y portugués los usan a propósito
    "S311",                        # random para jitter y muestras, no para secretos
    "S110", "S112",                # try/except/pass en limpiezas que no deben cortar el flujo (cerrar el navegador, etc.)
    "SIM105",                      # contextlib.suppress no es más claro que try/except/pass
    "RUF012",                      # __table_args__ de SQLAlchemy es un dict de clase por diseño
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "S", "SIM115", "SIM117"]
"tests_integration/*" = ["S", "SIM115"]
"loadtest/*" = ["S"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true
files = ["."]
exclude = ["^alembic/", "^chrome_extension/", "^build/", "^venv", "^mutants/"]

# mypy estricto por etapas: los módulos de esta lista ya cumplen --strict y no pueden volver atrás.
# Etapa 1: cuentas, sesiones, segundo factor, passkeys y modelos.
[[tool.mypy.overrides]]
module = ["accounts", "auth", "models", "passkeys", "security_events", "two_factor", "user_sessions", "version"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true

# Etapa 2: servicios, rutas y tareas del worker. Llaman a módulos que todavía no tienen tipos (base, scrapers,
# IA), así que acá no se exige disallow_untyped_calls hasta tiparlos.
[[tool.mypy.overrides]]
module = ["services.*", "routers.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true

# Etapa 3: scrapers, IA y parser de CVs. Playwright, BeautifulSoup y google-genai traen tipos; se exige todo.
[[tool.mypy.overrides]]
module = ["scrapers.*", "ai_engine", "resume_parser", "embeddings", "scraping_jobs", "job_dedup"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true

# Celery no trae tipos: @celery.task deja la tarea sin tipar, así que en tasks.* no se exige
# disallow_untyped_decorators; el resto sí.
[[tool.mypy.overrides]]
module = ["tasks.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true

# Etapa 4: el resto de los módulos de la app y los scripts. Con todo tipado, servicios y rutas también exigen
# disallow_untyped_calls.
[[tool.mypy.overrides]]
module = ["account_lifecycle", "account_notify", "ai_usage", "app", "ats_score", "celery_app", "cv_storage", "data_export", "db_config", "db_schema", "document_batch", "document_generators", "email_delivery", "error_reporting", "fastapi_web", "google_oauth", "i18n", "integrations", "job_alerts", "job_dispatch", "job_feedback", "job_matcher", "job_ranking", "main", "market_analyzer", "matching_eval", "notification_messages", "notifier", "observability", "onboarding", "profile_store", "push", "rate_limit", "scraper_stats", "security_headers", "skill_catalog", "tracker_export", "tracker_stats", "web_settings", "scripts.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "tests_integration/*", "scripts/*", "alembic/*", "locustfile.py", "load_tests/*"]
# los E2E levantan la app con uvicorn en otro proceso: también se mide
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
# mínimo de tests unitarios + integración juntos (job "coverage" del CI); los unitarios solos piden 60
fail_under = 80
skip_covered = true

[tool.mutmut]
# Pruebas de mutación sobre los módulos críticos: `mutmut run` y después `mutmut results`. Ver docs/mutation-testing.md.
paths_to_mutate = ["job_dedup.py", "rate_limit.py", "auth.py", "accounts.py"]
# Solo los tests de estos módulos: el resto revisa archivos del repo (Dockerfile, workflows) que no están en mutants/.
tests_dir = [
    "tests/conftest.py", "tests/test_job_dedup.py", "tests/test_dedup_eval.py", "tests/test_portal_search.py",
    "tests/test_rate_limits.py", "tests/test_auth.py", "tests/test_account_inactivity.py",
    "tests/test_account_integrations.py", "tests/test_two_factor.py", "tests/test_user_sessions.py",
    "tests/test_passkeys.py", "tests/test_security_events.py", "tests/test_account_rules.py", "tests/test_admin.py",
    "tests/test_legal.py"
]
# Lo que importan los tests y no se muta: mutmut corre desde mutants/ y no ve el resto del repo.
# tests/test_mutmut_config.py avisa si falta un módulo.
also_copy = [
    "eval", "scripts", "templates", "static", "routers", "services", "scrapers", "tasks", "alembic", "translations",
    "alembic.ini", "VERSION", "account_lifecycle.py", "account_notify.py", "ai_engine.py", "ai_usage.py", "app.py",
    "ats_score.py", "celery_app.py", "cv_storage.py", "data_export.py", "db_config.py", "db_schema.py",
    "document_batch.py", "document_generators.py", "email_delivery.py", "embeddings.py", "error_reporting.py",
    "fastapi_web.py", "google_oauth.py", "i18n.py", "integrations.py", "job_alerts.py", "job_dispatch.py",
    "job_feedback.py", "job_matcher.py", "job_ranking.py", "main.py", "market_analyzer.py", "matching_eval.py",
    "models.py", "notification_messages.py", "notifier.py", "observability.py", "onboarding.py", "passkeys.py",
    "profile_store.py", "push.py", "resume_parser.py", "scraper_stats.py", "scraping_jobs.py", "security_events.py",
    "security_headers.py", "skill_catalog.py", "tracker_export.py", "tracker_stats.py", "two_factor.py",
    "user_sessions.py", "version.py", "web_settings.py"
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q", "-x"]
