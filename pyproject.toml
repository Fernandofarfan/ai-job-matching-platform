[tool.ruff]
target-version = "py312"
extend-exclude = ["alembic/versions", "chrome_extension", "static"]

[tool.ruff.lint]
# Errores reales (pyflakes + bugbear); estilo y formato quedan fuera por ahora
select = ["E9", "F", "B"]
ignore = ["B904", "B007", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true
files = ["."]
exclude = ["^alembic/", "^chrome_extension/", "^build/", "^venv"]

# mypy estricto por etapas: los módulos de esta lista ya cumplen --strict y no pueden volver atrás.
# Etapa 1: cuentas, sesiones, segundo factor, passkeys y modelos.
[[tool.mypy.overrides]]
module = ["accounts", "auth", "models", "passkeys", "security_events", "two_factor", "user_sessions"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "tests_integration/*", "scripts/*", "alembic/*", "locustfile.py", "load_tests/*"]
# los E2E levantan la app con uvicorn en otro proceso: también se mide
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
# mínimo de tests unitarios + integración juntos (job "coverage" del CI); los unitarios solos piden 60
fail_under = 70
skip_covered = true
