# ============================================================
# EmpleoIA — Docker Compose
# Levanta: FastAPI app + MySQL + Redis + Celery Worker + Flower
# Requiere .env con: DB_PASSWORD, SECRET_KEY, REDIS_PASSWORD, FLOWER_PASSWORD
# ============================================================

services:

  # ── FastAPI Application ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?Definí DB_PASSWORD en .env (ver .env.example)}
      - DB_NAME=job_tracker
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Definí SECRET_KEY en .env (ver .env.example)}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - AI_RATE_LIMIT_PER_MINUTE=${AI_RATE_LIMIT_PER_MINUTE:-30}
      - SESSION_SECURE=${SESSION_SECURE:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL:-}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD:-}
      - LINKEDIN_TOKEN=${LINKEDIN_TOKEN:-}
      - INDEED_EMAIL=${INDEED_EMAIL:-}
      - INDEED_PASSWORD=${INDEED_PASSWORD:-}
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./profiles:/app/profiles
      - ./temp:/app/temp
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - empleoia-net
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Worker (Scraping + AI tasks) ──────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A celery_app worker
      --loglevel=info
      --queues=scraping,ai_processing,notifications
      --concurrency=2
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?Definí DB_PASSWORD en .env (ver .env.example)}
      - DB_NAME=job_tracker
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}@redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      # Credenciales de scrapers: el worker las lee directo del env
      # (las rutas solo las pasan por args si el usuario las tipeó en el form)
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL:-}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD:-}
      - LINKEDIN_TOKEN=${LINKEDIN_TOKEN:-}
      - LI_AT_TOKEN=${LI_AT_TOKEN:-}
      - INDEED_EMAIL=${INDEED_EMAIL:-}
      - INDEED_PASSWORD=${INDEED_PASSWORD:-}
      - BUMERAN_EMAIL=${BUMERAN_EMAIL:-}
      - BUMERAN_PASSWORD=${BUMERAN_PASSWORD:-}
      - COMPUTRABAJO_EMAIL=${COMPUTRABAJO_EMAIL:-}
      - COMPUTRABAJO_PASSWORD=${COMPUTRABAJO_PASSWORD:-}
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./profiles:/app/profiles
      - ./temp:/app/temp
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -t 5 2>/dev/null | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - empleoia-net
    logging: *default-logging

  # ── Celery Beat (Scheduled Tasks) ────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}@redis:6379/0
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?Definí DB_PASSWORD en .env (ver .env.example)}
      - DB_NAME=job_tracker
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - empleoia-net
    logging: *default-logging

  # ── Flower (Celery Dashboard) ─────────────────────────────────────
  # Solo expuesto en localhost del host
  flower:
    image: mher/flower:2.0.0
    command: celery flower --broker=redis://:${REDIS_PASSWORD}@redis:6379/0 --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?Definí FLOWER_PASSWORD en .env (ver .env.example)}
    restart: unless-stopped
    networks:
      - empleoia-net
    logging: *default-logging

  # ── Redis (Broker + Backend) ──────────────────────────────────────
  # Con contraseña y sin puertos públicos: solo la red interna empleoia-net
  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env (ver .env.example)}
    command: >
      sh -c 'exec redis-server
      --requirepass "$$REDIS_PASSWORD"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - empleoia-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MySQL ─────────────────────────────────────────────────────────
  # Solo expuesto en localhost del host
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?Definí DB_PASSWORD en .env (ver .env.example)}
      - MYSQL_DATABASE=job_tracker
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - empleoia-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_data:

networks:
  empleoia-net:
    driver: bridge
