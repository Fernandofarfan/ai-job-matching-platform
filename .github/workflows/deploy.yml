name: Deploy a GCP

# Push a main -> staging. Producción: "Run workflow" con environment=prod, eligiendo un tag vX.Y.Z en
# "Use workflow from" (conviene exigir aprobación en Settings > Environments > prod). Volver atrás es lo mismo
# con el tag anterior: la imagen de ese commit ya existe y no se reconstruye. Ver docs/releases.md.
# Necesita, por GitHub Environment:
#   variables: GCP_PROJECT_ID, GCP_REGION (opcional), GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SA, TF_STATE_BUCKET
#   secretos:  DB_PASSWORD, GEMINI_API_KEY, SECRET_KEY, CV_ENCRYPTION_KEY, EXTRA_SECRETS_JSON (opcional)
# El job corre solo con la variable de repositorio GCP_DEPLOY_ENABLED=true (las variables de un
# Environment no se ven en el `if:` del job). Sin ella se saltea y el repo funciona igual sin GCP.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [staging, prod]
        default: staging
  pull_request:
    paths: ["terraform/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Terraform plan' || 'Deploy' }} (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    if: vars.GCP_DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'southamerica-east1' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL }}
      TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
      TF_VAR_cv_encryption_key: ${{ secrets.CV_ENCRYPTION_KEY }}
      TF_VAR_extra_secrets: ${{ secrets.EXTRA_SECRETS_JSON || '{}' }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2.2.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Producción solo desde un tag de versión
        if: env.ENVIRONMENT == 'prod' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Producción se despliega desde un tag vX.Y.Z (elegilo en 'Use workflow from'), no desde $GITHUB_REF"
          exit 1

      - name: Imagen a desplegar
        run: |
          echo "TF_VAR_image=${REGION}-docker.pkg.dev/${TF_VAR_project_id}/empleoia-${ENVIRONMENT}/web:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="prefix=empleoia/${ENVIRONMENT}"

      - name: terraform plan
        if: github.event_name == 'pull_request'
        run: |
          terraform plan -input=false -no-color -var-file="envs/${ENVIRONMENT}.tfvars" > plan.txt
          { echo '### terraform plan (staging)'; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 1) Repositorio de imágenes (primer deploy) 2) build y push 3) migraciones 4) resto.
      - name: Artifact Registry
        if: github.event_name != 'pull_request'
        run: >
          terraform apply -input=false -auto-approve -var-file="envs/${ENVIRONMENT}.tfvars"
          -target=google_artifact_registry_repository.empleoia

      - name: Build y push de la imagen
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if gcloud artifacts docker images describe "$TF_VAR_image" > /dev/null 2>&1; then
            echo "La imagen de este commit ya existe: se despliega la misma"
            exit 0
          fi
          docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t "$TF_VAR_image" .
          docker push "$TF_VAR_image"

      - name: Migraciones de Alembic
        if: github.event_name != 'pull_request'
        run: |
          terraform apply -input=false -auto-approve -var-file="envs/${ENVIRONMENT}.tfvars" \
            -target=google_cloud_run_v2_job.migrate
          gcloud run jobs execute "$(terraform output -raw migrate_job)" --region "$REGION" --wait

      - name: Revisión que atiende hoy
        if: github.event_name != 'pull_request'
        run: |
          # La revisión nueva entra sin tráfico (etiqueta candidate) y esta sigue atendiendo hasta que la nueva pase el smoke test.
          prev="$(gcloud run services describe "empleoia-web-${ENVIRONMENT}" --region "$REGION" --format=json 2>/dev/null \
            | jq -r '[.status.traffic[]? | select(.percent == 100 and .revisionName != null)][0].revisionName // empty' || true)"
          echo "Revisión que atiende hoy: ${prev:-ninguna (primer deploy)}"
          echo "SERVING_REVISION=$prev" >> "$GITHUB_ENV"
          echo "TF_VAR_serving_revision=$prev" >> "$GITHUB_ENV"

      - name: terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve -var-file="envs/${ENVIRONMENT}.tfvars"

      - name: Smoke test y pase de tráfico
        if: github.event_name != 'pull_request'
        run: |
          url="$(terraform output -raw web_url)"
          svc="$(terraform output -raw web_service)"
          public="$(terraform output -raw public_access)"
          ready() {
            for i in 1 2 3 4 5; do
              curl -fsS "$1/api/ready" && return 0
              sleep 10
            done
            return 1
          }
          if [ -n "$SERVING_REVISION" ]; then
            candidate="$(gcloud run services describe "$svc" --region "$REGION" --format=json \
              | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"
            # Servicio privado: sin token de IAM Cloud Run responde 403; terraform apply ya esperó la revisión lista.
            if [ "$public" = "true" ] && ! ready "$candidate"; then
              echo "::error::La revisión nueva no pasa /api/ready y no recibió tráfico: sigue atendiendo $SERVING_REVISION"
              exit 1
            fi
            gcloud run services update-traffic "$svc" --region "$REGION" --to-latest
          fi
          if [ "$public" != "true" ]; then
            echo "Servicio privado: se omite el smoke test HTTP"
            exit 0
          fi
          if ! ready "$url"; then
            if [ -n "$SERVING_REVISION" ]; then
              gcloud run services update-traffic "$svc" --region "$REGION" --to-revisions "$SERVING_REVISION=100"
              echo "::error::/api/ready falla con la revisión nueva: el tráfico volvió a $SERVING_REVISION"
            fi
            exit 1
          fi
