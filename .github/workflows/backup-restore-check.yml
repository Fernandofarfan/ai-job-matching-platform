name: Verificar restauración de backups (Cloud SQL)

# Mensual y a mano: clona la instancia (PITR), restaura el último backup en una instancia temporal,
# comprueba las tablas y la borra. Usa las mismas variables del Environment que deploy.yml más
# BACKUP_CHECK_BUCKET (bucket donde exportar la copia). Corre solo con GCP_DEPLOY_ENABLED=true.
# Runbook: docs/backup-restore.md

on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  id-token: write

jobs:
  restore-check:
    name: Restore check (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2.2.1

      - name: Restaurar y verificar
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          INSTANCE: empleoia-mysql-${{ inputs.environment || 'staging' }}
          BUCKET: ${{ vars.BACKUP_CHECK_BUCKET }}
        run: scripts/verify_backup_restore.sh
