name: Pruebas de mutación

# mutmut sobre login, cuentas, límites de pedidos y ofertas repetidas (ver docs/mutation-testing.md).
# Tarda unos 25 minutos, por eso corre una vez por semana y a mano, no en cada PR. El reporte queda como artefacto.
on:
  schedule:
    - cron: "0 13 * * 1"  # los lunes, 10:00 en Argentina
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-mutation.txt

      - name: mutmut run
        run: mutmut run --max-children 4 > /dev/null

      - name: Reporte
        if: always()
        run: |
          python scripts/mutation_report.py > mutation-report.md
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"
          mutmut results > mutation-survivors.txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: mutation-report
          path: |
            mutation-report.md
            mutation-survivors.txt
