name: EmpleoIA CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Linting ──────────────────────────────────────────────
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linters
        run: pip install ruff mypy

      - name: Ruff (pyflakes + bugbear)
        run: ruff check . --output-format=github

      - name: Mypy (módulos tipados)
        run: mypy

      - name: Reglas de alerta de Prometheus (promtool)
        run: |
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v2.53.2/prometheus-2.53.2.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-2.53.2.linux-amd64/promtool
          ./promtool check rules monitoring/prometheus/alerts.yml
          ./promtool test rules monitoring/prometheus/alerts.test.yml

  # ─── Tests ────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            Werkzeug==3.1.9 \
            limits==5.8.0 \
            itsdangerous==2.2.0 \
            Jinja2==3.1.6 \
            python-multipart==0.0.33 \
            pyotp==2.9.0 \
            segno==1.6.6 \
            pandas==3.1.1 \
            numpy==2.5.4 \
            python-dotenv==1.2.4 \
            mysql-connector-python==26.10.0 \
            openpyxl==3.1.5 \
            reportlab==5.1.0 \
            SQLAlchemy==2.0.57 \
            pywebpush==1.14.1 \
            "celery[redis]==5.7.0" \
            beautifulsoup4==4.12.2 \
            lxml==6.1.3 \
            pytest-cov \
            alembic==1.20.1 \
            pytest==9.2.0 \
            fastapi==0.162.5 \
            httpx==0.28.1 \
            pytest-mock==3.17.0 \
            pydantic==2.14.3 \
            pypdf==7.0.1 \
            cryptography==50.0.2 \
            prometheus-client==0.26.0 \
            python-docx==0.8.11 \
            scikit-learn==1.9.1 \
            spacy==3.8.18

      - name: Download spacy model (small, for CI)
        run: python -m spacy download es_core_news_sm || true

      - name: Create required directories
        run: mkdir -p uploads results logs profiles temp/test_tasks

      - name: Create minimal .env for testing
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_USER=root
          DB_PASSWORD=
          DB_NAME=job_tracker
          DB_POOL_NAME=job_pool_test
          DB_POOL_SIZE=1
          SECRET_KEY=test-secret-key-ci-12345
          GEMINI_API_KEY=fake-key-for-testing
          EOF

      - name: Run tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=. --cov-report=term:skip-covered \
            --cov-fail-under=20

  # ─── Seguridad ────────────────────────────────────────────
  security:
    name: Security (bandit, pip-audit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install bandit pip-audit

      - name: Bandit (solo severidad alta)
        run: bandit -r . -x ./tests,./.venv -lll

      - name: pip-audit (informativo hasta que pillow/dnspython publiquen fix)
        run: pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integración (MySQL, Redis, Playwright)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: job_tracker
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      INTEGRATION: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: job_tracker
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m spacy download en_core_web_sm || true
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq xvfb

      - name: Esquema base (setup_database.sql) y migraciones
        run: |
          mkdir -p uploads results logs profiles
          python init_db.py
          python -m alembic upgrade head

      - name: Tests de integración, E2E y accesibilidad (axe)
        run: xvfb-run -a python -m pytest tests_integration -v --tb=short -p no:cacheprovider

      - name: Paquete de la extensión de Chrome
        run: python scripts/package_extension.py --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/empleoia-saver-*.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lighthouse (accesibilidad >= 90, buenas prácticas >= 75, rendimiento >= 60 como aviso)
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 5000 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:5000/api/health > /dev/null && break; sleep 1; done
          CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright as p; s = p().start(); print(s.chromium.executable_path); s.stop()')" \
            npx -y @lhci/cli@0.14.0 autorun --config=lighthouserc.json

      - name: Reportes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: |
            .lighthouseci/
            uvicorn.log
          if-no-files-found: ignore

  # ─── Resumen de estado ────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, integration]
    if: always()
    steps:
      - name: Print CI Result
        run: |
          echo "================================================="
          echo "EmpleoIA CI/CD Pipeline Completed"
          echo "Lint:  ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Integration: ${{ needs.integration.result }}"
          echo "================================================="
