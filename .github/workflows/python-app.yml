name: EmpleoIA CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Linting (repo completo) ──────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 (repo completo — errores críticos)
        run: |
          flake8 . \
            --max-line-length=120 \
            --select=E9,F63,F7,F82 \
            --exclude=.venv,__pycache__,.git,alembic \
            --count --statistics

  # ─── Docker build (valida imagen + entrypoint de migraciones) ──
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t empleoia-ci:latest .

  # ─── Tests ────────────────────────────────────────────────
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies (requirements-dev.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create required directories
        run: mkdir -p uploads results logs profiles temp/test_tasks

      - name: Create minimal .env for testing
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_USER=root
          DB_PASSWORD=
          DB_NAME=job_tracker
          DB_POOL_NAME=job_pool_test
          DB_POOL_SIZE=1
          SECRET_KEY=test-secret-key-ci-12345
          GEMINI_API_KEY=fake-key-for-testing
          DATABASE_URL=sqlite:///temp/test_ci.db
          EOF

      - name: Run tests (suite completa + cobertura de routers/core)
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=routers --cov=core --cov=ai_engine --cov=ai_tools \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ─── Resumen de estado ────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: always()
    steps:
      - name: Print CI Result
        run: |
          echo "================================================="
          echo "EmpleoIA CI/CD Pipeline Completed"
          echo "Lint:   ${{ needs.lint.result }}"
          echo "Tests:  ${{ needs.test.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          echo "================================================="
