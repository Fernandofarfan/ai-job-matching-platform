name: EmpleoIA CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Linting ──────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          # Errores críticos: sintaxis, nombres indefinidos y comparaciones inválidas
          flake8 . \
            --select=E9,F63,F7,F82 \
            --exclude=.venv,__pycache__,.git \
            --count --show-source --statistics
        continue-on-error: false

  # ─── Tests ────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            Flask==3.1.3 \
            Werkzeug==3.1.9 \
            Flask-Limiter==4.1.1 \
            flask-wtf==1.2.2 \
            flask-socketio==5.3.6 \
            eventlet==0.41.3 \
            pandas \
            numpy \
            python-dotenv==1.2.4 \
            mysql-connector-python \
            openpyxl \
            reportlab \
            pytest \
            pytest-flask \
            pytest-mock \
            pydantic \
            pypdf \
            python-docx \
            scikit-learn \
            spacy \
            nltk

      - name: Download spacy model (small, for CI)
        run: python -m spacy download es_core_news_sm || true

      - name: Create required directories
        run: mkdir -p uploads results logs profiles temp/test_tasks

      - name: Create minimal .env for testing
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_USER=root
          DB_PASSWORD=
          DB_NAME=job_tracker
          DB_POOL_NAME=job_pool_test
          DB_POOL_SIZE=1
          SECRET_KEY=test-secret-key-ci-12345
          GEMINI_API_KEY=fake-key-for-testing
          EOF

      - name: Run tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/test_resume_parser.py \
            -x

      - name: Run resume parser tests (best-effort)
        run: |
          python -m pytest tests/test_resume_parser.py -v --tb=short || true
        continue-on-error: true

  # ─── Seguridad ────────────────────────────────────────────
  security:
    name: Security (bandit, pip-audit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install bandit pip-audit

      - name: Bandit (solo severidad alta)
        run: bandit -r . -x ./tests,./.venv -lll

      - name: pip-audit (informativo hasta que pillow/dnspython publiquen fix)
        run: pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Resumen de estado ────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    steps:
      - name: Print CI Result
        run: |
          echo "================================================="
          echo "EmpleoIA CI/CD Pipeline Completed"
          echo "Lint:  ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "================================================="
