name: EmpleoIA CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Linting ──────────────────────────────────────────────
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # mypy necesita FastAPI, SQLAlchemy y Pydantic instalados: sin ellos sus decoradores
      # y modelos quedan como Any y las reglas estrictas fallan o no revisan nada.
      - name: Install dependencies and linters
        run: |
          pip install --require-hashes -r requirements.txt
          pip install ruff mypy

      - name: Ruff (pyflakes + bugbear)
        run: ruff check . --output-format=github

      - name: Mypy (módulos tipados)
        run: mypy

      - name: Reglas de alerta de Prometheus (promtool)
        run: |
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v2.53.2/prometheus-2.53.2.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-2.53.2.linux-amd64/promtool
          ./promtool check rules monitoring/prometheus/alerts.yml
          ./promtool test rules monitoring/prometheus/alerts.test.yml

  # ─── Tests ────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            Werkzeug==3.1.9 \
            limits==5.8.0 \
            itsdangerous==2.2.0 \
            Jinja2==3.1.6 \
            python-multipart==0.0.33 \
            pyotp==2.9.0 \
            segno==1.6.6 \
            pandas==3.1.1 \
            numpy==2.5.4 \
            python-dotenv==1.2.4 \
            mysql-connector-python==26.10.0 \
            openpyxl==3.1.5 \
            reportlab==5.1.0 \
            SQLAlchemy==2.1.8 \
            pywebpush==1.14.1 \
            "celery[redis]==5.7.0" \
            beautifulsoup4==4.12.2 \
            lxml==6.1.3 \
            pytest-cov \
            alembic==1.20.1 \
            pytest==9.2.0 \
            fastapi==0.162.5 \
            httpx==0.28.1 \
            pytest-mock==3.17.0 \
            pydantic==2.14.3 \
            pypdf==7.0.1 \
            cryptography==50.0.2 \
            webauthn==2.7.1 \
            prometheus-client==0.26.0 \
            sentry-sdk==2.74.0 \
            python-docx==0.8.11 \
            scikit-learn==1.9.1

      - name: Create required directories
        run: mkdir -p uploads results logs profiles temp/test_tasks

      - name: Create minimal .env for testing
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_USER=root
          DB_PASSWORD=
          DB_NAME=job_tracker
          DB_POOL_NAME=job_pool_test
          DB_POOL_SIZE=1
          SECRET_KEY=test-secret-key-ci-12345
          GEMINI_API_KEY=fake-key-for-testing
          EOF

      - name: Run tests
        env:
          COVERAGE_FILE: .coverage.unit
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov --cov-report=term --cov-fail-under=60

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true

  # ─── Seguridad ────────────────────────────────────────────
  security:
    name: Security (bandit, pip-audit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install bandit pip-audit

      - name: Bandit (solo severidad alta)
        run: bandit -r . -x ./tests,./.venv -lll

      - name: pip-audit (informativo hasta que pillow/dnspython publiquen fix)
        run: pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: requirements.txt al día con requirements.in
        run: |
          pip install pip-tools==7.6.2
          pip-compile --quiet --generate-hashes --allow-unsafe --no-strip-extras requirements.in -o requirements.txt
          git diff --exit-code requirements.txt || { echo "::error::Regenerá requirements.txt con pip-compile (ver requirements.in)"; exit 1; }

  # ─── Imagen Docker: vulnerabilidades y SBOM ───────────────
  image:
    name: Imagen (Trivy y SBOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build de la imagen
        run: docker build -t empleoia:${{ github.sha }} .

      - name: Trivy (vulnerabilidades críticas con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: empleoia:${{ github.sha }}
          version: v0.76.2
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: empleoia:${{ github.sha }}
          version: v0.76.2
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  integration:
    name: Integración (MySQL, Redis, Playwright)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: job_tracker
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      INTEGRATION: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: job_tracker
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install pytest==9.2.0 pytest-cov==7.1.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq xvfb

      - name: Esquema completo con Alembic
        run: |
          mkdir -p uploads results logs profiles
          python -m alembic upgrade head

      - name: Tests de integración, E2E y accesibilidad (axe)
        env:
          COVERAGE_FILE: .coverage.integration
        run: >-
          xvfb-run -a python -m pytest tests_integration -v --tb=short -p no:cacheprovider
          --cov --cov-report=term --cov-fail-under=0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true

      - name: Paquete de la extensión de Chrome
        run: python scripts/package_extension.py --out dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: chrome-extension
          path: dist/empleoia-saver-*.zip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - name: Lighthouse (accesibilidad >= 90, buenas prácticas >= 75, rendimiento >= 60 como aviso)
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 5000 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:5000/api/health > /dev/null && break; sleep 1; done
          CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright as p; s = p().start(); print(s.chromium.executable_path); s.stop()')" \
            npx -y @lhci/cli@0.14.0 autorun --config=lighthouserc.json

      - name: Reportes de Lighthouse
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: lighthouse
          path: |
            .lighthouseci/
            uvicorn.log
          if-no-files-found: ignore

  # ─── Prueba de carga ──────────────────────────────────────
  loadtest:
    name: Carga (Locust, p95 y errores)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: job_tracker
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: job_tracker
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      LOGIN_REQUIRED: "true"
      SCRAPER_BACKEND: thread
      LOADTEST_EMAIL: carga@example.com
      # límites del gate; la línea base local está en docs/load-testing.md
      LOADTEST_P95_MS: "800"
      LOADTEST_MAX_FAIL_RATIO: "0.01"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          # Locust en un venv aparte para no sumarle gevent a la app
          python -m venv .venv-load
          .venv-load/bin/pip install --require-hashes -r requirements-loadtest.txt

      - name: Secretos efímeros
        run: |
          mkdir -p uploads results logs profiles
          echo "LOADTEST_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(16))')" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
          echo "CV_ENCRYPTION_KEY=$(python -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" >> "$GITHUB_ENV"

      - name: Cargar datos y levantar la app
        run: |
          python -m alembic upgrade head
          ADMIN_EMAIL="$LOADTEST_EMAIL" python loadtest/seed.py --jobs 85
          ADMIN_EMAIL="$LOADTEST_EMAIL" python -m uvicorn main:app --host 127.0.0.1 --port 5000 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:5000/api/health > /dev/null && break; sleep 1; done

      - name: Locust (20 usuarios, 90 s)
        run: >-
          .venv-load/bin/locust -f loadtest/locustfile.py --host http://127.0.0.1:5000
          --headless -u 20 -r 5 -t 90s --csv loadtest-results/loadtest --only-summary

      - name: Resultados de la prueba de carga
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: loadtest
          path: |
            loadtest-results/
            uvicorn.log
          if-no-files-found: ignore

  # ─── Comparación visual contra la rama base ───────────────
  visual:
    name: Visual (capturas contra la rama base)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      pull-requests: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      LOGIN_REQUIRED: "true"
      ALLOW_SIGNUP: "true"
      SCRAPER_BACKEND: thread
      # mismo orden de sets y dicts en las dos versiones
      PYTHONHASHSEED: "0"
      VISUAL_EMAIL: visual@example.com
      ADMIN_EMAIL: visual@example.com
    steps:
      - name: Checkout del PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Checkout de la rama base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .visual-base

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies (PR y base, cada una en su entorno)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m venv .venv-base
          .venv-base/bin/pip install --require-hashes -r .visual-base/requirements.txt

      - name: Secretos efímeros
        run: |
          echo "VISUAL_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(16))')" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
          echo "CV_ENCRYPTION_KEY=$(python -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" >> "$GITHUB_ENV"

      # Cada versión con su base de datos, su Redis y los mismos datos de loadtest/seed.py
      - name: Capturas de la base y del PR
        run: |
          if [ ! -f .visual-base/loadtest/seed.py ]; then
            echo "La rama base no tiene loadtest/seed.py: no hay con qué comparar"; exit 0
          fi
          mkdir -p visual
          snap() {
            local dir=$1 py=$2 db=$3 port=$4 redis_db=$5
            mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE $db"
            export DB_NAME=$db REDIS_URL=redis://127.0.0.1:6379/$redis_db
            export CELERY_BROKER_URL=$REDIS_URL CELERY_RESULT_BACKEND=$REDIS_URL
            (cd "$dir" && mkdir -p uploads results logs profiles && "$py" -m alembic upgrade head \
              && LOADTEST_EMAIL=$VISUAL_EMAIL LOADTEST_PASSWORD=$VISUAL_PASSWORD "$py" loadtest/seed.py --jobs 30)
            (cd "$dir" && "$py" -m uvicorn main:app --host 127.0.0.1 --port "$port" > "$GITHUB_WORKSPACE/visual/uvicorn-$db.log" 2>&1 &)
            for i in $(seq 1 60); do curl -fs "http://127.0.0.1:$port/api/health" > /dev/null && break; sleep 1; done
            python scripts/visual_snapshots.py --base-url "http://127.0.0.1:$port" --out "visual/${db#visual_}"
          }
          snap .visual-base "$GITHUB_WORKSPACE/.venv-base/bin/python" visual_base 5001 1
          snap . python visual_head 5002 2
          echo "VISUAL_READY=1" >> "$GITHUB_ENV"

      # Las etiquetas se leen ahora y no del evento, así "Re-run" toma una 'cambio-visual' recién puesta
      - name: Comparar (con la etiqueta 'cambio-visual' solo informa)
        if: env.VISUAL_READY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mode=""
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx cambio-visual; then
            mode="--report-only"
          fi
          python scripts/visual_diff.py visual/base visual/head --diff visual/diff $mode

      - name: Capturas y diferencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: visual
          path: visual/
          if-no-files-found: ignore

  # ─── OWASP ZAP sobre la app levantada ─────────────────────
  zap:
    name: OWASP ZAP (app levantada, con sesión)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zap
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: zap
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      LOGIN_REQUIRED: "true"
      ALLOW_SIGNUP: "true"
      SCRAPER_BACKEND: thread
      ZAP_EMAIL: zap@example.com
      ADMIN_EMAIL: zap@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Secretos efímeros
        run: |
          echo "ZAP_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(16))')" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
          echo "CV_ENCRYPTION_KEY=$(python -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" >> "$GITHUB_ENV"

      - name: App con una cuenta con datos
        run: |
          mkdir -p uploads results logs profiles zap
          python -m alembic upgrade head
          LOADTEST_EMAIL=$ZAP_EMAIL LOADTEST_PASSWORD=$ZAP_PASSWORD python loadtest/seed.py --jobs 20
          python -m uvicorn main:app --host 127.0.0.1 --port 5000 > zap/uvicorn.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:5000/api/health > /dev/null && break; sleep 1; done

      - name: Baseline de ZAP (WARN o FAIL cortan el CI; las aceptadas están en .zap/rules.tsv)
        run: scripts/zap_scan.sh http://127.0.0.1:5000 zap

      - name: Resumen
        if: always()
        run: cat zap/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Reporte de ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: zap
          path: zap/
          if-no-files-found: ignore

  # ─── Cobertura: unitarios + integración ───────────────────
  coverage:
    name: Cobertura (mínimo 70%)
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combinar y exigir el mínimo de pyproject.toml
        run: |
          pip install coverage==7.17.3
          coverage combine --keep .coverage.unit .coverage.integration
          coverage report

  # ─── Resumen de estado ────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, integration, image, coverage, loadtest, visual, zap]
    if: always()
    steps:
      - name: Print CI Result
        run: |
          echo "================================================="
          echo "EmpleoIA CI/CD Pipeline Completed"
          echo "Lint:  ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Integration: ${{ needs.integration.result }}"
          echo "Image: ${{ needs.image.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Load test: ${{ needs.loadtest.result }}"
          echo "Visual: ${{ needs.visual.result }}"
          echo "ZAP: ${{ needs.zap.result }}"
          echo "================================================="
