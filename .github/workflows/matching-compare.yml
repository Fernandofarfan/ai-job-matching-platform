name: Comparar matching

# TF-IDF contra embeddings de Gemini sobre eval/matching_dataset.json, en total y por idioma del CV.
# Necesita el secreto GEMINI_API_KEY; sin él solo mide TF-IDF. El resultado queda como artefacto.
on:
  schedule:
    - cron: "0 12 * * 1"  # los lunes, 9:00 en Argentina
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: TF-IDF vs embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Comparar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/eval_matching.py --compare --json > matching-compare.json
          cat matching-compare.json
          { echo '```json'; cat matching-compare.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: matching-compare
          path: matching-compare.json
